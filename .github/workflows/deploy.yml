name: Deploy Frontend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted # 👈 Chuyển từ ubuntu-latest sang self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build Frontend
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci
          echo "🛠️ Building static files..."
          npm run build

      - name: 🚀 Deploy to Nginx web root
        run: |
          echo "🚀 Đưa code đã build vào thư mục của Nginx..."
          # Vì Runner chạy trực tiếp trên server, ta chỉ cần copy thư mục dist/
          # vào thẳng /var/www/conghaiso/ mà không cần SSH
          sudo rsync -a --delete dist/ /var/www/conghaiso/
          
          echo "🔐 Cấp quyền truy cập cho Nginx..."
          sudo chown -R www-data:www-data /var/www/conghaiso

          echo "✅ Triển khai Frontend thành công!"